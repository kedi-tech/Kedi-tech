name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  # GHCR requires lowercase names; github.repository is "kedi-tech/Kedi-tech".
  IMAGE: ghcr.io/kedi-tech/kedi-tech
  CONTAINER: kedi-tech-website
  # Coolify's Traefik (container "coolify-proxy") routes the domain to the
  # container over this Docker network; no host port is published.
  PROXY_NETWORK: coolify
  DOMAIN: kedi-tech.com
  SITE_URL: https://kedi-tech.com

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    permissions:
      contents: read
      packages: read
    steps:
      # Writes the key to a file and checks it before connecting, so a missing
      # or malformed secret fails here with a clear reason instead of
      # "ssh: no key found" inside the SSH action. The key is never printed.
      - name: Prepare and check the SSH key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          KEY_FILE: ${{ runner.temp }}/deploy_key
        run: |
          set -eu
          [ -n "$SERVER_IP" ]   || { echo "::error::SERVER_IP is empty or not shared with this repository."; exit 1; }
          [ -n "$SERVER_USER" ] || { echo "::error::SERVER_USER is empty or not shared with this repository."; exit 1; }
          if [ -z "$SERVER_SSH_KEY" ]; then
            echo "::error::SERVER_SSH_KEY is empty. If it is an organization secret, allow this repository in Organization settings > Secrets > SERVER_SSH_KEY > Repository access."
            exit 1
          fi

          # Tolerates a key pasted with Windows line endings or as one line with literal \n.
          printf '%s\n' "$SERVER_SSH_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if ! grep -q -- '-----BEGIN .*PRIVATE KEY-----' "$KEY_FILE"; then
            if grep -qE '^(ssh-(rsa|ed25519)|ecdsa-sha2)' "$KEY_FILE"; then
              echo "::error::SERVER_SSH_KEY holds a PUBLIC key. Paste the PRIVATE key (the file without .pub)."
            else
              echo "::error::SERVER_SSH_KEY is not a private key: it must start with -----BEGIN OPENSSH PRIVATE KEY-----."
            fi
            exit 1
          fi
          if ! ssh-keygen -y -P '' -f "$KEY_FILE" > /dev/null 2>&1; then
            echo "::error::SERVER_SSH_KEY cannot be read: it is truncated or protected by a passphrase. Use a key without passphrase."
            exit 1
          fi

          ssh -i "$KEY_FILE" -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "$SERVER_USER@$SERVER_IP" 'echo "SSH OK: $(whoami)@$(hostname)"' \
            || { echo "::error::The server refused the key. Add its public key to ~/.ssh/authorized_keys of $SERVER_USER on the server."; exit 1; }

      - name: Check the runtime secrets
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          [ -n "$WEBHOOK_URL" ] || { echo "::error::WEBHOOK_URL is empty. Add the Make.com webhook URL in Settings > Secrets and variables > Actions."; exit 1; }

      - name: Pull and restart the container over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
          CONTAINER: ${{ env.CONTAINER }}
          PROXY_NETWORK: ${{ env.PROXY_NETWORK }}
          DOMAIN: ${{ env.DOMAIN }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          envs: IMAGE,CONTAINER,PROXY_NETWORK,DOMAIN,REGISTRY_USER,REGISTRY_TOKEN,WEBHOOK_URL
          script_stop: true
          script: |
            set -eu
            APP_DIR="$HOME/kedi-tech-website"
            mkdir -p "$APP_DIR"
            umask 077

            # Runtime env, rewritten on every deploy from the repository secrets.
            {
              printf 'WEBHOOK_URL=%s\n' "$WEBHOOK_URL"
            } > "$APP_DIR/.env"

            echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            docker pull "$IMAGE"
            docker logout ghcr.io

            docker network inspect "$PROXY_NETWORK" >/dev/null 2>&1 \
              || { echo "Docker network $PROXY_NETWORK not found: is Coolify's proxy running?"; exit 1; }

            # Router names are unique to this site. The high priority makes this
            # router win over any older kedi-tech.com route left in Coolify.
            docker rm -f "$CONTAINER" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              --network "$PROXY_NETWORK" \
              --env-file "$APP_DIR/.env" \
              --label "traefik.enable=true" \
              --label "traefik.docker.network=$PROXY_NETWORK" \
              --label "traefik.http.services.kedi-tech.loadbalancer.server.port=3000" \
              --label "traefik.http.routers.kedi-tech.rule=Host(\`$DOMAIN\`) || Host(\`www.$DOMAIN\`)" \
              --label "traefik.http.routers.kedi-tech.entrypoints=https" \
              --label "traefik.http.routers.kedi-tech.tls=true" \
              --label "traefik.http.routers.kedi-tech.tls.certresolver=letsencrypt" \
              --label "traefik.http.routers.kedi-tech.priority=1000" \
              --label "traefik.http.routers.kedi-tech.service=kedi-tech" \
              --label "traefik.http.middlewares.kedi-tech-https.redirectscheme.scheme=https" \
              --label "traefik.http.routers.kedi-tech-http.rule=Host(\`$DOMAIN\`) || Host(\`www.$DOMAIN\`)" \
              --label "traefik.http.routers.kedi-tech-http.entrypoints=http" \
              --label "traefik.http.routers.kedi-tech-http.priority=1000" \
              --label "traefik.http.routers.kedi-tech-http.middlewares=kedi-tech-https" \
              --label "traefik.http.routers.kedi-tech-http.service=kedi-tech" \
              "$IMAGE"

            # Fail the job if the site does not answer through Traefik within a minute.
            # Goes through the proxy on this server, so it tests the route and TLS too.
            # "/" redirects to "/fr", so check the French home page directly.
            for i in $(seq 1 30); do
              code=$(curl -sk -o /dev/null -w '%{http_code}' --resolve "$DOMAIN:443:127.0.0.1" "https://$DOMAIN/fr" || true)
              if [ "$code" = "200" ]; then
                echo "Website is up through Traefik (HTTP 200)."
                docker image prune -f >/dev/null
                exit 0
              fi
              sleep 2
            done
            echo "Traefik answered HTTP $code for $DOMAIN. Container logs:"
            docker logs --tail 80 "$CONTAINER"
            echo "Proxy logs mentioning kedi-tech:"
            docker logs --since 5m coolify-proxy 2>&1 | grep -i kedi-tech | tail -20 || true
            exit 1

      # Working on the server does not prove the domain works from outside:
      # this catches DNS or firewall problems.
      - name: Check kedi-tech.com from the internet
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -L -w '%{http_code}' "$SITE_URL/" || true)
            if [ "$code" = "200" ]; then
              echo "$SITE_URL is live (HTTP 200)."
              exit 0
            fi
            sleep 3
          done
          echo "::error::$SITE_URL answered HTTP $code from the internet, but the site works through Traefik on the server. Check DNS for $DOMAIN and the server firewall (ports 80/443)."
          exit 1
